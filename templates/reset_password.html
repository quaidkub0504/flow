<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Reset Password — Danboise Flow</title>
<link rel="icon" href="/static/img/logo.png"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
  body{background:#14151f;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{position:relative;border:1px solid #2f3146;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,0.4);padding:40px;width:360px;
    background-image:linear-gradient(rgba(28,30,45,0.93),rgba(28,30,45,0.93)),url('/static/img/100years.png');
    background-repeat:no-repeat,no-repeat;
    background-position:center,center 85%;
    background-size:cover,320px auto;}
  .logo-img{max-width:220px;height:auto;display:block;margin:0 auto 4px;}
  .sub{font-size:13px;color:#9295ac;margin-bottom:24px;text-align:center;}
  label{display:block;font-size:12px;font-weight:700;color:#e4e6f0;margin:14px 0 6px;}
  input{width:100%;padding:10px 12px;border:1px solid #2f3146;border-radius:8px;font-size:14px;
    background:#14151f;color:#e4e6f0;}
  input:focus{outline:none;border-color:#0073ea;}
  button{width:100%;margin-top:22px;background:#0073ea;color:#fff;border:none;padding:11px;border-radius:8px;
    font-size:14px;font-weight:700;cursor:pointer;}
  button:hover{background:#1a86ff;}
  .error{color:#ff6b81;font-size:12px;margin-top:10px;text-align:center;}
  .expired{color:#e4e6f0;font-size:13px;line-height:1.6;text-align:center;}
  .alt-link{margin-top:16px;text-align:center;font-size:12px;}
  .alt-link a{color:#0073ea;text-decoration:none;}
  .alt-link a:hover{text-decoration:underline;}
</style>
</head>
<body>
<div class="card">
  <img src="/static/img/logo.png" alt="AJ Danboise" class="logo-img"/>
  {% if valid %}
  <div class="sub">Choose a new password</div>
  <form id="resetForm">
    <label>New password</label>
    <input name="password" type="password" minlength="8" required autofocus/>
    <label>Confirm password</label>
    <input name="confirm" type="password" minlength="8" required/>
    <button type="submit">Set new password</button>
    <div class="error" id="err"></div>
  </form>
  {% else %}
  <div class="expired">This reset link has expired or is invalid.<br/>Request a new one below.</div>
  <div class="alt-link" style="margin-top:18px;"><a href="/forgot-password">Request a new link</a></div>
  {% endif %}
  <div class="alt-link"><a href="/login">Back to sign in</a></div>
</div>
{% if valid %}
<script>
document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const password = fd.get('password');
  const confirm = fd.get('confirm');
  const err = document.getElementById('err');
  if (password !== confirm) { err.textContent = "Passwords don't match"; return; }
  const r = await fetch('/api/reset-password', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({token: {{ token|tojson }}, password})
  });
  const d = await r.json();
  if (d.success) { window.location.href = '/'; }
  else { err.textContent = d.error || 'Something went wrong.'; }
});
</script>
{% endif %}
</body>
</html>
