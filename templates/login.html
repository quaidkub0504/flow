<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>AJD Work — Login</title>
<link rel="icon" href="/static/img/logo.png"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
  body{background:#14151f;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{background:#1c1e2d;border:1px solid #2f3146;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,0.4);padding:40px;width:360px;}
  .logo-img{max-width:220px;height:auto;display:block;margin:0 auto 4px;}
  .sub{font-size:13px;color:#9295ac;margin-bottom:24px;text-align:center;}
  label{display:block;font-size:12px;font-weight:700;color:#e4e6f0;margin:14px 0 6px;}
  input{width:100%;padding:10px 12px;border:1px solid #2f3146;border-radius:8px;font-size:14px;
    background:#14151f;color:#e4e6f0;}
  input:focus{outline:none;border-color:#0073ea;}
  button{width:100%;margin-top:22px;background:#0073ea;color:#fff;border:none;padding:11px;border-radius:8px;
    font-size:14px;font-weight:700;cursor:pointer;}
  button:hover{background:#1a86ff;}
  .error{color:#ff6b81;font-size:12px;margin-top:10px;text-align:center;}
</style>
</head>
<body>
<div class="card">
  <img src="/static/img/logo.png" alt="AJ Danboise" class="logo-img"/>
  <div class="sub">Sign in to your workspace</div>
  <form id="loginForm">
    <label>Email</label>
    <input name="email" type="email" required autofocus/>
    <label>Password</label>
    <input name="password" type="password" required/>
    <button type="submit">Sign In</button>
    <div class="error" id="err">{{ error or '' }}</div>
  </form>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/api/login', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({email: fd.get('email'), password: fd.get('password')})
  });
  const d = await r.json();
  if (d.success) { window.location.href = '/'; }
  else { document.getElementById('err').textContent = d.error || 'Login failed'; }
});
</script>
</body>
</html>
