<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Danboise Flow — Setup</title>
<link rel="icon" href="/static/img/logo.png"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',system-ui,sans-serif;}
  body{background:#14151f;min-height:100vh;display:flex;align-items:center;justify-content:center;}
  .card{position:relative;border:1px solid #2f3146;border-radius:14px;box-shadow:0 8px 30px rgba(0,0,0,0.4);padding:40px;width:380px;
    background-image:linear-gradient(rgba(28,30,45,0.93),rgba(28,30,45,0.93)),url('/static/img/100years.png');
    background-repeat:no-repeat,no-repeat;
    background-position:center,center 85%;
    background-size:cover,320px auto;}
  .logo-img{max-width:220px;height:auto;display:block;margin-bottom:4px;}
  .sub{font-size:13px;color:#9295ac;margin-bottom:24px;}
  label{display:block;font-size:12px;font-weight:700;color:#e4e6f0;margin:14px 0 6px;}
  input{width:100%;padding:10px 12px;border:1px solid #2f3146;border-radius:8px;font-size:14px;
    background:#14151f;color:#e4e6f0;}
  input:focus{outline:none;border-color:#0073ea;}
  button{width:100%;margin-top:22px;background:#0073ea;color:#fff;border:none;padding:11px;border-radius:8px;
    font-size:14px;font-weight:700;cursor:pointer;}
  button:hover{background:#1a86ff;}
  .error{color:#ff6b81;font-size:12px;margin-top:10px;}
</style>
</head>
<body>
<div class="card">
  <img src="/static/img/logo.png" alt="AJ Danboise" class="logo-img"/>
  <div class="sub">First-time setup — create the admin account</div>
  <form id="setupForm">
    <label>Your Name</label>
    <input name="name" required autofocus/>
    <label>Email</label>
    <input name="email" type="email" required/>
    <label>Password (8+ characters)</label>
    <input name="password" type="password" minlength="8" required/>
    <button type="submit">Create Account</button>
    <div class="error" id="err"></div>
  </form>
</div>
<script>
document.getElementById('setupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const fd = new FormData(e.target);
  const r = await fetch('/api/setup', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({name: fd.get('name'), email: fd.get('email'), password: fd.get('password')})
  });
  const d = await r.json();
  if (d.success) { window.location.href = '/'; }
  else { document.getElementById('err').textContent = d.error || 'Setup failed'; }
});
</script>
</body>
</html>
