<div class="topbar">
  <button class="sidebar-toggle-btn" onclick="toggleMobileSidebar()" title="Menu">☰</button>
  <div class="global-search">
    <span class="global-search-icon">⌕</span>
    <input id="globalSearchInput" name="ajdwork_global_search" placeholder="Search for anything…"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
           oninput="onGlobalSearchInput(this.value)"/>
    <span class="global-search-hint" onclick="openCommandPalette()" title="Quick actions (Ctrl/Cmd+K)">⌘K</span>
    <div id="searchDropdown" class="search-dropdown" style="display:none;"></div>
  </div>
  <div class="topbar-actions">
    <button class="bell-btn" onclick="openShortcutsModal()" title="Keyboard shortcuts (?)">⌨</button>
    <button class="bell-btn" onclick="toggleBellPanel()" title="Notifications">🔔</button>
    <div id="bellPanel" class="bell-panel" style="display:none;"></div>
    <div class="user-chip" style="background:{{ user.color }};" title="{{ user.name }}">{{ user.name[0]|upper }}</div>
  </div>
</div>

<div class="cmd-palette-backdrop" id="cmdPaletteBackdrop" style="display:none;"
     onclick="if (event.target === this) closeCommandPalette();">
  <div class="cmd-palette">
    <div class="cmd-palette-input-row">
      <span class="global-search-icon" style="position:static;">⌕</span>
      <input id="cmdPaletteInput" placeholder="Search boards, items, or jump to a page…"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
             oninput="onCommandPaletteInput(this.value)" onkeydown="cmdPaletteKeydown(event)"/>
      <span class="cmd-palette-hint">Esc</span>
    </div>
    <div class="cmd-palette-results" id="cmdPaletteResults"></div>
  </div>
</div>

<div class="modal-backdrop" id="shortcutsModal" style="display:none;">
  <div class="modal" style="width:380px;">
    <div class="modal-hdr">Keyboard Shortcuts</div>
    <div class="shortcuts-list">
      <div class="shortcuts-row"><span class="shortcuts-keys"><kbd>Ctrl</kbd>/<kbd>⌘</kbd><kbd>K</kbd></span><span>Quick actions — jump to a board or item</span></div>
      <div class="shortcuts-row"><span class="shortcuts-keys"><kbd>/</kbd></span><span>Focus search</span></div>
      <div class="shortcuts-row"><span class="shortcuts-keys"><kbd>N</kbd></span><span>New item (or new board, outside a board)</span></div>
      <div class="shortcuts-row"><span class="shortcuts-keys"><kbd>Esc</kbd></span><span>Close whatever's open</span></div>
      <div class="shortcuts-row"><span class="shortcuts-keys"><kbd>?</kbd></span><span>Show this list</span></div>
    </div>
    <div class="modal-actions">
      <button class="btn-primary" onclick="closeShortcutsModal()">Got it</button>
    </div>
  </div>
</div>
